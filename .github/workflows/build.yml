name: Build & Package macOS Installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-13 # Intel x86_64 runner compatible with macOS 12+
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Test Suite
        run: |
          make test

      - name: Build MacNetLedger.app
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_app.sh

      - name: Package .pkg Installer
        run: |
          ./scripts/package_pkg.sh

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacNetLedger-Installer
          path: build/MacNetLedger-Installer.pkg

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & Package
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_app.sh
          ./scripts/package_pkg.sh

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: build/MacNetLedger-Installer.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
