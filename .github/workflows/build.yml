name: Build & Package macOS Installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Test Suite
        run: |
          make test

      - name: Build MacNetLedger.app (Universal Binary)
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_app.sh

      - name: Package .pkg Installer
        run: |
          ./scripts/package_pkg.sh

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacNetLedger-Installer
          path: build/MacNetLedger-Installer.pkg

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & Package
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_app.sh
          ./scripts/package_pkg.sh

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: build/MacNetLedger-Installer.pkg
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
